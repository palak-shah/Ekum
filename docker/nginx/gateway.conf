# Bot detection — must live in http context (conf.d is included from http {}).
map $http_user_agent $ekum_share_bot {
  default 0;
  ~*(WhatsApp|facebookexternalhit|Facebot|Twitterbot|TelegramBot|Slackbot|LinkedInBot|Discordbot) 1;
}

# Preserve https from the host TLS proxy (Compose itself listens on http).
map $http_x_forwarded_proto $ekum_forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

server {
  listen 80;
  server_name _;

  client_max_body_size 50m;

  # Nest API (global prefix /api + URI version → /api/v1/...)
  location /api/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $ekum_forwarded_proto;
    proxy_pass http://api:3000;
  }

  # Local media disk driver (outside /api)
  location /media/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $ekum_forwarded_proto;
    proxy_pass http://api:3000;
  }

  # Messenger crawlers get branded OG HTML from the API (not the SPA shell).
  # Named locations via 418 — `rewrite … last` to /__og/ fell through to the SPA.
  location ~ ^/s/(?<share_token>[^/]+)$ {
    error_page 418 = @og_share_link;
    if ($ekum_share_bot = 1) {
      return 418;
    }
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $ekum_forwarded_proto;
    proxy_pass http://web:80;
  }

  location @og_share_link {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $ekum_forwarded_proto;
    proxy_pass http://api:3000/api/v1/share-links/$share_token/card;
  }

  location ~ ^/r/(?<invite_token>[^/]+)$ {
    error_page 418 = @og_referral;
    if ($ekum_share_bot = 1) {
      return 418;
    }
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $ekum_forwarded_proto;
    proxy_pass http://web:80;
  }

  location @og_referral {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $ekum_forwarded_proto;
    proxy_pass http://api:3000/api/v1/referrals/$invite_token/card;
  }

  location / {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $ekum_forwarded_proto;
    proxy_pass http://web:80;
  }
}
