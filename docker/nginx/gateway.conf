# Bot detection — must live in http context (conf.d is included from http {}).
map $http_user_agent $ekum_share_bot {
  default 0;
  ~*(WhatsApp|facebookexternalhit|Facebot|Twitterbot|TelegramBot|Slackbot|LinkedInBot|Discordbot) 1;
}

server {
  listen 80;
  server_name _;

  client_max_body_size 50m;

  # Nest API (global prefix /api + URI version → /api/v1/...)
  location /api/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://api:3000;
  }

  # Local media disk driver (outside /api)
  location /media/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://api:3000;
  }

  # OG card proxies — entered only via rewrite from /s/ and /r/ (not `internal`
  # so rewrite-last always matches; path is harmless if hit directly).
  location ~ ^/__og/s/(?<og_token>[^/]+)$ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://api:3000/api/v1/share-links/$og_token/card;
  }

  location ~ ^/__og/r/(?<og_token>[^/]+)$ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://api:3000/api/v1/referrals/$og_token/card;
  }

  # Humans → SPA; messenger crawlers → API card HTML (never index.html defaults).
  location ~ ^/s/(?<share_token>[^/]+)$ {
    if ($ekum_share_bot = 1) {
      rewrite ^ /__og/s/$share_token last;
    }
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://web:80;
  }

  location ~ ^/r/(?<invite_token>[^/]+)$ {
    if ($ekum_share_bot = 1) {
      rewrite ^ /__og/r/$invite_token last;
    }
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://web:80;
  }

  location / {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://web:80;
  }
}
