server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA: client-side router
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache hashed assets; keep HTML fresh
  location /assets/ {
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control "public, immutable";
  }
}
