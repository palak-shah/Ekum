# Ekum Docker Compose — Postgres + API + web + Nginx gateway
# Public entry: http://localhost:8080

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ekum
      POSTGRES_PASSWORD: ekum
      POSTGRES_DB: ekum
    volumes:
      - ekum_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ekum -d ekum']
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - ekum

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      # Production image build; development runtime so local OTP demos work (see .env.docker).
      NODE_ENV: ${NODE_ENV:-development}
      PORT: '3000'
      DATABASE_URL: postgresql://ekum:ekum@postgres:5432/ekum?schema=public
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      PUBLIC_MEDIA_BASE_URL: ${PUBLIC_MEDIA_BASE_URL:-http://localhost:8080/media}
    volumes:
      - ekum_media:/app/apps/api/.media
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(\"http://127.0.0.1:3000/api/v1/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - ekum

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_PUBLIC_ORIGIN: ${VITE_PUBLIC_ORIGIN:-http://localhost:8080}
        VITE_WEB_PUSH_PUBLIC_KEY: ${VITE_WEB_PUSH_PUBLIC_KEY:-}
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - ekum

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - '${EKUM_HTTP_PORT:-8080}:80'
    volumes:
      - ./docker/nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    networks:
      - ekum

volumes:
  ekum_pg:
  ekum_media:

networks:
  ekum:
    driver: bridge
