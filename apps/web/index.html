<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2B7379" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Ekum" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta
      name="description"
      content="Ekum — B2B textile trade, organised. Discover suppliers, share collections, and manage orders."
    />
    <link rel="icon" href="/brand/favicon.ico" sizes="any" />
    <link rel="icon" href="/brand/app-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Open Graph — messenger link previews (WhatsApp, Telegram, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ekum" />
    <meta property="og:title" content="Ekum" />
    <meta
      property="og:description"
      content="Ekum — B2B textile trade, organised. Discover suppliers, share collections, and manage orders."
    />
    <meta property="og:image" content="%VITE_PUBLIC_ORIGIN%/brand/app-icon-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:url" content="%VITE_PUBLIC_ORIGIN%/" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Ekum" />
    <meta
      name="twitter:description"
      content="Ekum — B2B textile trade, organised. Discover suppliers, share collections, and manage orders."
    />
    <meta name="twitter:image" content="%VITE_PUBLIC_ORIGIN%/brand/app-icon-512.png" />

    <meta name="ekum-web-build" content="%VITE_WEB_BUILD%" />
    <title>Ekum</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        function ekumCheckWebBuild() {
          if (document.visibilityState === 'hidden') return;
          var meta = document.querySelector('meta[name="ekum-web-build"]');
          var local = meta && meta.getAttribute('content');
          if (!local || local.indexOf('%VITE_') === 0) return;
          fetch('/api/v1/web-build', { cache: 'no-store' })
            .then(function (res) {
              if (res.ok) return res.json();
              return fetch('/version.json', { cache: 'no-store' }).then(function (fallback) {
                return fallback.ok ? fallback.json() : null;
              });
            })
            .then(function (data) {
              if (!data || !data.build) return;
              if (data.build === local) {
                window.__ekumWebBuildStale = false;
                return;
              }
              window.__ekumWebBuildStale = true;
              window.dispatchEvent(new CustomEvent('ekum:web-build-stale'));
              var home =
                window.navigator.standalone === true ||
                (window.matchMedia &&
                  window.matchMedia('(display-mode: standalone)').matches);
              if (!home) return;
              var path = window.location.pathname;
              if (path === '/login' || path === '/onboarding') return;
              var ae = document.activeElement;
              if (
                ae &&
                (ae.tagName === 'INPUT' ||
                  ae.tagName === 'TEXTAREA' ||
                  ae.tagName === 'SELECT' ||
                  ae.isContentEditable)
              ) {
                return;
              }
              try {
                if (localStorage.getItem('ekum-hs-reload') === data.build) return;
                localStorage.setItem('ekum-hs-reload', data.build);
              } catch (e) {}
              // Reload only — do not unregister / delete caches (wipes iOS login).
              window.location.reload();
            })
            .catch(function () {});
        }
        ekumCheckWebBuild();
        window.addEventListener('pageshow', ekumCheckWebBuild);
        window.setInterval(ekumCheckWebBuild, 20000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
