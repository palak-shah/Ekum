name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_candidate:
        description: Run docker smoke + @release journeys (RC)
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @ekum/api prisma:generate

      - name: Build shared contracts
        run: pnpm --filter @ekum/domain-types build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # Blocks every push and PR. Production web build (vite preview) + service worker.
  # WebKit is Playwright's engine, not a real iPhone — see docs/superpowers/qa/mobile-and-pwa-test-matrix.md
  e2e-smoke-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ekum
          POSTGRES_PASSWORD: ekum
          POSTGRES_DB: ekum
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ekum -d ekum"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ekum:ekum@127.0.0.1:5432/ekum?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-0123456789abcdef0123456789abcdef
      JWT_REFRESH_SECRET: ci-refresh-secret-0123456789abcdef0123456789abcdef
      OTP_EXPOSE_DEV_CODE: true
      JOBS_ENABLED: false
      CORS_ORIGINS: http://127.0.0.1:4173,http://127.0.0.1:5173
      VITE_API_BASE_URL: /api/v1
      EKUM_API_URL: http://127.0.0.1:3000/api/v1
      EKUM_WEB_URL: http://127.0.0.1:4173
      EKUM_EXPECT_SW: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium and WebKit
        run: pnpm --filter @ekum/e2e exec playwright install --with-deps chromium webkit

      - name: Prepare database and API
        run: |
          pnpm --filter @ekum/api prisma:generate
          pnpm --filter @ekum/domain-types build
          pnpm --filter @ekum/api exec prisma migrate deploy
          pnpm --filter @ekum/api db:seed
          pnpm --filter @ekum/api build

      - name: Run production-preview smoke
        run: pnpm test:e2e:smoke:preview

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-preview-smoke
          path: |
            apps/e2e/test-results
            apps/e2e/playwright-report
          if-no-files-found: ignore

  # Post-deploy smoke: nginx gateway + built images. Blocks main; also manual dispatch.
  e2e-smoke-docker:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium and WebKit
        run: pnpm --filter @ekum/e2e exec playwright install --with-deps chromium webkit

      - name: Start Docker stack
        run: |
          cp .env.docker.example .env.docker
          pnpm docker:up
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8080/api/v1/health >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          pnpm docker:logs || true
          exit 1

      - name: Seed
        run: pnpm docker:seed

      - name: Run Docker PWA smoke
        run: pnpm test:e2e:smoke:docker
        env:
          EKUM_WEB_URL: http://127.0.0.1:8080
          EKUM_API_URL: http://127.0.0.1:8080/api/v1
          EKUM_EXPECT_SW: '1'
          EKUM_EXPECT_GATEWAY: '1'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-docker-smoke
          path: |
            apps/e2e/test-results
            apps/e2e/playwright-report
          if-no-files-found: ignore

  # RC only: Chromium mobile @release journeys (Vite dev). Not every push.
  e2e-release:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_candidate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ekum
          POSTGRES_PASSWORD: ekum
          POSTGRES_DB: ekum
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ekum -d ekum"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ekum:ekum@127.0.0.1:5432/ekum?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-0123456789abcdef0123456789abcdef
      JWT_REFRESH_SECRET: ci-refresh-secret-0123456789abcdef0123456789abcdef
      OTP_EXPOSE_DEV_CODE: true
      JOBS_ENABLED: false
      CORS_ORIGINS: http://127.0.0.1:5173
      VITE_API_BASE_URL: /api/v1
      EKUM_API_URL: http://127.0.0.1:3000/api/v1
      EKUM_WEB_URL: http://127.0.0.1:5173
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @ekum/e2e exec playwright install --with-deps chromium

      - name: Prepare database
        run: |
          pnpm --filter @ekum/api prisma:generate
          pnpm --filter @ekum/domain-types build
          pnpm --filter @ekum/api exec prisma migrate deploy
          pnpm --filter @ekum/api db:seed

      - name: Run @release journeys
        run: pnpm test:e2e:release

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-release-journeys
          path: |
            apps/e2e/test-results
            apps/e2e/playwright-report
          if-no-files-found: ignore
